services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://geo:geo@postgres:5432/geo
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      GEONAMES_DIR: /data/geonames
    # Only reachable through the web container's reverse proxy; trust its X-Forwarded-For.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    expose: ["8000"]
    volumes: [appdata:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://geo:geo@postgres:5432/geo
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      GEONAMES_DIR: /data/geonames
    command: arq app.worker.WorkerSettings
    volumes: [appdata:/data]
    depends_on:
      api: {condition: service_healthy}

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  appdata:
