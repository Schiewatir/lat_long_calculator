schema: spec-driven

context: |
  Product: Geocoding Workbench - multi-user web app that ingests CSV/Excel/TXT address files
  (street optional, city, postcode, country), repairs dirty input, geocodes to lat/lon with an
  explainable 0-100 confidence score, supports human review/confirmation and CSV export.
  Volume: 200 to 200,000 rows per file.

  Backend: Python 3.12, FastAPI, SQLAlchemy 2.x + Alembic, PostgreSQL, Redis + arq (background jobs),
  pandas + openpyxl (+ xlrd for .xls), rapidfuzz, pycountry, OpenAI Python SDK (structured outputs,
  Batch API), httpx, argon2-cffi, pydantic-settings (config from .env).
  Frontend: React + TypeScript + Vite, TanStack Query, TanStack Table + TanStack Virtual,
  Leaflet (react-leaflet) with marker clustering.
  Infra: Docker Compose for local dev (api, worker, web, postgres, redis).

  Domain rules:
  - OpenAI is NEVER a source of coordinates; it only repairs inputs, suggests column mappings and
    disambiguates between geocoder candidates.
  - Coordinates come from offline GeoNames data (postcodes/cities) or a storage-permitting geocoding
    API (OpenCage default). Google Geocoding is excluded (ToS forbids storing/exporting).
  - Secrets (OPENAI_API_KEY, geocoder key) live in .env, server-side only.
  - Confidence is computed deterministically from measurable signals, never from LLM self-reports.
